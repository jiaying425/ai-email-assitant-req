<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 邮件助手｜需求选择</title><style>
:root{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#1e293b;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:930px;margin:35px auto;padding:0 18px 45px}.hero{background:linear-gradient(120deg,#152b49,#275c79);color:white;padding:35px;border-radius:20px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;opacity:.87}.panel{background:white;border:1px solid #e5eaf1;border-radius:18px;padding:25px;margin-top:20px;box-shadow:0 5px 25px #182a4408}h2{font-size:20px;margin:0 0 12px}.muted{color:#64748b;font-size:14px}.count{font-weight:700;color:#0e7490}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.filter{border:1px solid #dbe3eb;background:white;color:#475569;padding:9px 13px;border-radius:30px;cursor:pointer}.filter.active{background:#1b5472;color:white;border-color:#1b5472}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.feature{border:1px solid #dbe3eb;border-radius:13px;padding:17px;cursor:pointer;display:block;position:relative;transition:.15s}.feature:hover{border-color:#4c9bb1}.feature.selected{background:#edf8fb;border-color:#1784a0}.feature input{position:absolute;right:17px;top:17px;width:18px;height:18px;accent-color:#0e7490}.feature strong{display:block;padding-right:30px}.feature p{font-size:14px;color:#64748b;margin:9px 0}.example{font-size:13px;background:#f4f7fa;border-radius:8px;padding:10px;color:#475569;line-height:1.6}.field{margin:20px 0}.field label{display:block;font-weight:650;margin-bottom:8px}textarea{width:100%;min-height:95px;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font:inherit;resize:vertical}.options label{display:block;font-weight:400;margin:11px 0}.options input{accent-color:#0e7490}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}button{font:inherit}.primary{border:0;background:#176781;color:white;padding:13px 22px;border-radius:10px;cursor:pointer;font-weight:700}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{border:1px solid #cbd5e1;background:white;padding:13px 20px;border-radius:10px;cursor:pointer}.status{margin-top:14px;line-height:1.6}.note{font-size:13px;color:#64748b;line-height:1.7}footer{margin-top:20px;text-align:center;color:#94a3b8;font-size:12px}@media(max-width:640px){.cards{grid-template-columns:1fr}.hero{padding:25px}.hero h1{font-size:25px}.panel{padding:18px}}
</style></head><body><main><header class="hero"><h1>✉️ AI 邮件助手</h1><p>选出您最希望 AI 帮忙完成的 3 件事</p></header><section class="panel"><h2>您最需要哪些功能？ <span class="count" id="count">0 / 3</span></h2><p class="muted">点击卡片选择功能。每个功能都附有实际使用示例。</p><div class="filters" id="filters"></div><div class="cards" id="cards"></div></section><section class="panel"><h2>告诉我们您的实际需求</h2><div class="field"><label for="pain">您处理邮件时，最大的困难是什么？</label><textarea id="pain" placeholder="例如：客户邮件太多，容易忘记回复；很难找到之前的报价……"></textarea></div><div class="field"><label>您希望 AI 如何帮助您？</label><div class="options"><label><input type="radio" name="autonomy" value="只提供建议"> 只帮我查找、总结和提出建议</label><label><input type="radio" name="autonomy" value="确认后执行" checked> 帮我准备好内容，经过我确认再执行</label><label><input type="radio" name="autonomy" value="授权后自动执行"> 经过授权后，自动处理一些常规邮件</label></div></div><div class="field"><label for="extra">还有其他希望 AI 帮您做的事情吗？（选填）</label><textarea id="extra" placeholder="您的其他想法……"></textarea></div><div class="actions"><button class="primary" id="submit" disabled>提交需求</button><button class="secondary" id="copy">复制我的选择</button></div><div class="status" id="status" role="status" aria-live="polite"></div><p class="note">本页面仅收集您主动填写的需求，不会读取、发送或删除您的邮件。请不要填写密码或其他敏感信息。</p></section><footer>AI 邮件助手 · 需求体验版</footer></main><script>
// 部署后，将下方地址替换成你的 Google Apps Script Web App /exec 地址。
const SCRIPT_URL = 'PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';
const features=[
['查找和总结邮件','快速找到客户或供应商邮件，并总结重要内容。','帮我找出最近一个月的供应商报价，并总结价格和服务内容。','查找与整理'],
['识别重要邮件','从大量邮件中找出需要优先处理的事项。','今天哪些客户邮件需要我优先处理？','查找与整理'],
['整理客户和供应商报价','比较不同公司的报价、服务和需要确认的信息。','帮我比较三家清洁公司的报价和服务范围。','查找与整理'],
['帮我起草回复','根据邮件内容写好回复，等我确认后再发送。','帮我礼貌地回复客户，确认下周二交货。','沟通与回复'],
['提醒我跟进客户','找出长时间没有回复的客户或供应商。','哪些客户超过三天没有回复我的报价？','沟通与回复'],
['回复常见问题','根据我的营业信息和服务说明准备回复。','帮我回复客户关于营业时间和服务范围的问题。','沟通与回复'],
['提取待办事项','整理邮件中的任务、截止日期和需要跟进的事情。','帮我列出这周邮件里提到的所有待办事项。','工作与时间'],
['每天生成邮件简报','汇总重要邮件和当天需要完成的工作。','总结今天最重要的五封邮件。','工作与时间'],
['协助安排会议','帮助确认会议时间并准备邀请。','帮我准备与客户下周开会的邀请。','工作与时间'],
['自动整理邮箱','按客户、供应商、账单和广告等类型整理邮件。','帮我把供应商邮件和账单邮件分类。','自动化管理'],
['清理广告邮件','识别不需要的广告和订阅邮件，建议清理。','找出我最近一个月不需要的促销邮件。','自动化管理'],
['把邮件变成工作任务','把客户请求转成待处理工作清单。','把客户的维修请求整理成待办任务。','自动化管理']];
const selected=new Set();let category='全部';const $=id=>document.getElementById(id);
function render(){const categories=['全部','查找与整理','沟通与回复','工作与时间','自动化管理'];$('filters').replaceChildren(...categories.map(c=>{let b=document.createElement('button');b.className='filter'+(category===c?' active':'');b.textContent=c;b.onclick=()=>{category=c;render()};return b}));$('cards').replaceChildren(...features.map((f,i)=>{if(category!=='全部'&&f[3]!==category)return null;let card=document.createElement('label');card.className='feature'+(selected.has(i)?' selected':'');let check=document.createElement('input');check.type='checkbox';check.checked=selected.has(i);check.disabled=!selected.has(i)&&selected.size>=3;check.onchange=()=>{check.checked?selected.add(i):selected.delete(i);render()};let title=document.createElement('strong');title.textContent=f[0];let desc=document.createElement('p');desc.textContent=f[1];let example=document.createElement('div');example.className='example';example.textContent='例如：“'+f[2]+'”';card.append(check,title,desc,example);return card}).filter(Boolean));$('count').textContent=selected.size+' / 3';$('submit').disabled=selected.size!==3}
function payload(){return {features:[...selected].sort((a,b)=>a-b).map(i=>features[i][0]),pain:$('pain').value.trim(),autonomy:document.querySelector('input[name="autonomy"]:checked').value,extra:$('extra').value.trim()}}
function report(){let p=payload();return 'AI 邮件助手需求记录\n\n最需要的功能：\n'+p.features.join('\n')+'\n\nAI 操作偏好：'+p.autonomy+'\n\n最大困难：'+(p.pain||'未填写')+'\n\n其他需求：'+(p.extra||'未填写')}
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report());$('status').textContent='已复制，可以粘贴到微信或邮件中。'}catch(e){$('status').textContent='复制失败，请使用浏览器复制功能。'}};
$('submit').onclick=async()=>{if(selected.size!==3)return;if(!SCRIPT_URL.startsWith('https://script.google.com/macros/s/')){$('status').textContent='网站尚未连接 Google Sheets。请联系页面提供者；您也可以先点击「复制我的选择」。';return}let b=$('submit');b.disabled=true;b.textContent='提交中……';$('status').textContent='';try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload())});$('status').textContent='提交请求已发送。由于 Google Apps Script 的跨域限制，网页无法直接确认是否保存成功；请让页面提供者核对 Google Sheets。';}catch(e){$('status').textContent='网络请求失败，请稍后重试，或使用「复制我的选择」。'}finally{b.disabled=false;b.textContent='提交需求'}};render();
</script></body></html>
